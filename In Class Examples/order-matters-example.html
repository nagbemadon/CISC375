<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Log Test</title>
</head>
<body>
    <script>
        function printBox(numRows, numCols, boxChar = "X") {
            for (let i = 0; i < numRows; i++) {
                let line = "";

                for (let j = 0; j < numCols; j++) {
                    line += boxChar;
                }
                console.log(line);
            }
        }

        
        function myFunc(a, b, c){
            function otherFunc(a, b){
                a+= 1;
                return a+b;
            }
            var d = otherFunc(a, b);
            console.log(a, b, c, d);        
        }
        
        myFunc(1, 3.14, "hi");
        myFunc(1, "hi");
        // otherFunc(5, 8);
        

        printBox(5, 4, "!");
        printBox(2, 6);
    </script>

</body>
</html>
